[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rsi-demo"
version = "0.1.0"
description = "A safe, local, sandboxed demonstration of Recursive Self-Improvement (RSI) in Python."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rsi-demo = "rsi_demo.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
